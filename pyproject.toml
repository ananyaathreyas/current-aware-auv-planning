[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "current-aware-auv-planning"
version = "0.1.0"
description = "Energy-aware path planning for autonomous underwater vehicles in ocean currents"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "xarray",
    "netCDF4",
    "harmony-py",
    "earthaccess",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]